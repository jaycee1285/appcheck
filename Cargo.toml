[package]
name = "apptrack"
version = "0.1.0"
edition = "2024"
description = "A personal application ledger for decisions, provenance, and updates"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "0.9"
toml_edit = "0.23"
unicode-width = "0.2"
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }
