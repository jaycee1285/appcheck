# AppTrack — accepted initial bootstrap, 2026-09-09
#
# This file is the working ledger. The source Markdown files are reference only.
# Coverage: named local trial apps, all ten tauri.nix personal apps, coding agents,
# and explicit "to archive" decisions. The rest of Master-Apps-List is on TASKBOARD.
#
# Missing installed/version fields mean UNKNOWN, not false or latest.
# Considering is the conservative bootstrap default; installed does not mean Using.
# Personal tauri.nix apps are Using per apptrack.md; review that choice here.
# evidence.download_version describes source notes, NOT the installed executable.
# No imported app is owned by AppTrack. No removal receipts have been issued.
# Recipe, provenance_history, and additional hand-written fields survive TUI edits.
#
